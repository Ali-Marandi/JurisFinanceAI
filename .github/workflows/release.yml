name: Build and Release JurisFinanceAI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0)'
        required: true
        default: '4.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyInstaller PyQt6 openai httpx pdfplumber python-docx matplotlib numpy Pillow cryptography scipy openpyxl reportlab

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -v --tb=short

      - name: Build application
        run: |
          pyinstaller build.spec --noconfirm

      - name: Create archive
        run: |
          cd dist/JurisFinanceAI
          7z a -tzip ../../JurisFinanceAI-Windows-x64.zip .
        shell: bash

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME:-"v${{ github.event.inputs.version }}"}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "## JurisFinanceAI ${TAG}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Changes in this Release" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log --oneline $(git describe --tags --abbrev=0 HEAD^)..HEAD 2>/dev/null | while read -r line; do
            echo "- ${line}" >> CHANGELOG.md
          done || echo "- Bug fixes and improvements" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Installation" >> CHANGELOG.md
          echo "1. Download and extract the ZIP file" >> CHANGELOG.md
          echo "2. Run JurisFinanceAI.exe" >> CHANGELOG.md
          echo "3. Configure API key in Settings (optional)" >> CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: JurisFinanceAI ${{ steps.changelog.outputs.tag }}
          body_path: CHANGELOG.md
          files: |
            JurisFinanceAI-Windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
